name: Discourse Full Integration Test

on:
  push:
    branches:
      - test-2.3.0
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discourse-integration:
    name: Discourse + VIP SePay
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: discourse/discourse_test:release

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: discourse
          POSTGRES_PASSWORD: discourse
          POSTGRES_DB: discourse_test
        options: >-
          --health-cmd "pg_isready -U discourse -d discourse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RAILS_ENV: test
      DISCOURSE_DB_HOST: postgres
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_NAME: discourse_test
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: discourse
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: 6379

    steps:
      # ============================================================
      # 1. CHECKOUT PLUGIN
      # ============================================================
      - name: Checkout VIP SePay plugin
        uses: actions/checkout@v4
        with:
          path: discourse-vip-sepay

      # ============================================================
      # 2. CHECKOUT DISCOURSE SOURCE
      # ============================================================
      - name: Checkout Discourse
        uses: actions/checkout@v4
        with:
          repository: discourse/discourse
          path: discourse
          fetch-depth: 1

      # ============================================================
      # 3. SHOW VERSIONS
      # ============================================================
      - name: Show versions
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "Discourse commit"
          echo "======================================"

          cd discourse
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "VIP SePay commit"
          echo "======================================"

          cd ../discourse-vip-sepay
          git rev-parse HEAD

      # ============================================================
      # 4. INSTALL PLUGIN
      # ============================================================
      - name: Install VIP SePay plugin
        shell: bash
        run: |
          set -eux

          rm -rf discourse/plugins/discourse-vip-sepay

          cp -a \
            discourse-vip-sepay \
            discourse/plugins/discourse-vip-sepay

          test -f discourse/plugins/discourse-vip-sepay/plugin.rb

          echo "Plugin installed successfully"

          ls -la discourse/plugins/discourse-vip-sepay

      # ============================================================
      # 5. CONFIGURE BUNDLE
      # ============================================================
      - name: Configure Ruby bundle
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle config set --local path vendor/bundle
          bundle config set --local deployment true

      # ============================================================
      # 6. INSTALL RUBY DEPENDENCIES
      # ============================================================
      - name: Install gems
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle install --jobs 4

      # ============================================================
      # 7. CHECK DATABASE
      # ============================================================
      - name: Check PostgreSQL
        shell: bash
        run: |
          set -eux

          pg_isready \
            -h "$DISCOURSE_DB_HOST" \
            -p "$DISCOURSE_DB_PORT" \
            -U "$DISCOURSE_DB_USERNAME"

      # ============================================================
      # 8. CREATE DATABASE
      # ============================================================
      - name: Create database
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rake db:create

      # ============================================================
      # 9. RUN DATABASE MIGRATIONS
      # ============================================================
      - name: Run Discourse migrations
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rake db:migrate

      # ============================================================
      # 10. CHECK VIP SEPAY TABLES
      # ============================================================
      - name: Check VIP SePay database tables
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails runner '
            required_tables = %w[
              vip_sepay_plans
              vip_sepay_orders
              vip_sepay_subscriptions
              vip_sepay_transactions
              vip_sepay_audit_logs
            ]

            required_tables.each do |table|
              abort "Missing table: #{table}" unless ActiveRecord::Base.connection.data_source_exists?(table)
              puts "OK table: #{table}"
            end
          '

      # ============================================================
      # 11. CHECK SITE SETTINGS
      # ============================================================
      - name: Check VIP SePay settings
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails runner '
            required = %w[
              vip_sepay_enabled
              vip_sepay_bank_name
              vip_sepay_bank_bin
              vip_sepay_bank_template
              vip_sepay_account_number
              vip_sepay_account_holder
              vip_sepay_payment_prefix
              vip_sepay_webhook_secret
              vip_sepay_webhook_tolerance_seconds
              vip_sepay_order_expiry_minutes
              vip_sepay_extend_existing
              vip_sepay_replace_different_group
              vip_sepay_require_exact_amount
              vip_sepay_cleanup_paid_orders_days
              vip_sepay_cleanup_audit_days
              vip_sepay_reconciliation_enabled
              vip_sepay_api_token
              vip_sepay_api_base_url
              vip_sepay_reconciliation_days
              vip_sepay_reconciliation_per_page
              vip_sepay_http_timeout_seconds
            ]

            required.each do |name|
              abort "Missing SiteSetting: #{name}" unless SiteSetting.respond_to?(name)

              value = SiteSetting.public_send(name)

              if name.include?("secret") || name.include?("token")
                value = "[REDACTED]"
              end

              puts "OK setting: #{name}=#{value.inspect}"
            end
          '

      # ============================================================
      # 12. CHECK PLUGIN CONSTANTS
      # ============================================================
      - name: Check plugin boot
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails runner '
            abort "DiscourseVipSepay module missing" unless defined?(DiscourseVipSepay)

            puts "PLUGIN_NAME=#{DiscourseVipSepay::PLUGIN_NAME}"
            puts "VERSION=#{DiscourseVipSepay::VERSION}"

            puts "VIP SePay plugin boot: OK"
          '

      # ============================================================
      # 13. CHECK ROUTES
      # ============================================================
      - name: Check VIP SePay routes
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails routes > /tmp/routes.txt

          grep -i "vip" /tmp/routes.txt || true

          echo "Routes loaded successfully"

      # ============================================================
      # 14. RUN PLUGIN RSpec
      # ============================================================
      - name: Run VIP SePay RSpec
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rake plugin:spec["discourse-vip-sepay"]

      # ============================================================
      # 15. FULL RAILS BOOT
      # ============================================================
      - name: Test full Rails boot
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails runner '
            puts "Rails environment: #{Rails.env}"
            puts "Rails version: #{Rails.version}"
            puts "Discourse Rails boot: OK"
          '

      # ============================================================
      # 16. FINAL DATABASE CHECK
      # ============================================================
      - name: Final integration check
        working-directory: discourse
        shell: bash
        run: |
          set -eux

          bundle exec rails runner '
            puts
            puts "=========================================="
            puts " DISCOURSE + VIP SEPAY INTEGRATION PASS "
            puts "=========================================="
            puts

            puts "Discourse: #{Discourse::VERSION::STRING rescue "loaded"}"
            puts "Plugin: #{DiscourseVipSepay::VERSION}"

            puts
            puts "Database tables:"
            %w[
              vip_sepay_plans
              vip_sepay_orders
              vip_sepay_subscriptions
              vip_sepay_transactions
              vip_sepay_audit_logs
            ].each do |table|
              puts "  ✓ #{table}"
            end

            puts
            puts "Integration test completed successfully."
          '
